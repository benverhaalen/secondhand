resources:
  jobs:
    term_list:
      name: secondhand-term-list
      environments:
        - environment_key: terms
          spec:
            environment_version: "3"
      tasks:
        - task_key: term_list
          environment_key: terms
          spark_python_task:
            python_file: ../../databricks/tasks/term_list.py
            parameters: ["--root", "${workspace.file_path}", "--catalog", "${var.catalog}"]
