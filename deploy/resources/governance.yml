resources:
  jobs:
    governance_setup:
      name: secondhand-governance-setup
      environments:
        - environment_key: guard
          spec:
            environment_version: "3"
      tasks:
        - task_key: why
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../databricks/sql/07_why.sql
              source: WORKSPACE
        - task_key: constraints
          depends_on: [{ task_key: why }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../databricks/sql/08_constraints.sql
              source: WORKSPACE
        - task_key: sources
          depends_on: [{ task_key: constraints }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../databricks/sql/11_sources.sql
              source: WORKSPACE
        - task_key: guard
          depends_on: [{ task_key: sources }]
          environment_key: guard
          spark_python_task:
            python_file: ../../databricks/tasks/guard_job.py
            parameters: ["--root", "${workspace.file_path}"]
