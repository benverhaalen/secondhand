<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"NM";src:url(fonts/text-400.otf);font-weight:400}
@font-face{font-family:"NM";src:url(fonts/text-500.otf);font-weight:500}
@font-face{font-family:"CL";src:url(fonts/display-600.otf) format("truetype");font-weight:600}
:root{--ft:"NM","Helvetica Neue",Arial,sans-serif;--fd:"CL","NM",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#D5D9DC;font-family:var(--ft);display:flex;gap:28px;align-items:flex-start;font-feature-settings:"tnum"}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font:400 15px/20px var(--ft);color:#222}
.ph{width:390px;height:844px;padding:0 20px;display:flex;flex-direction:column;background:var(--page);color:var(--ink);border-radius:44px;overflow:hidden;position:relative}
.ph>*{position:relative}
.ph>.wash{position:absolute;left:0;right:0;top:0;height:200px;background:var(--wash)}
.top{height:54px;flex:none}
/* header: wordmark left, inbox right, one 44 row (Instagram, Threads) */
.nav{height:44px;flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 -10px}
.wm{text-align:center}
.wm{font:600 21px/1 var(--fd);letter-spacing:-.01em;position:relative;top:.12em}
.inbox{width:44px;height:44px;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:3px;right:0px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--page);font:500 13px/20px var(--ft);text-align:center;box-shadow:0 0 0 2px var(--badge-ring)}
.money{flex:none;padding-top:8px}
.money .lbl{font:400 13px/18px var(--ft);color:var(--ink2)}
.money .amt{font:400 36px/40px var(--ft);letter-spacing:-.015em}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:32px}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{flex:none;height:156px;border-radius:36px;padding:16px;background:var(--surface);box-shadow:var(--card-edge);display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.card.field{box-shadow:none;color:var(--ink);background:radial-gradient(at 30% 100%,var(--f2),transparent 60%),radial-gradient(at 100% 100%,var(--f3),transparent 65%),var(--f1)}
.row{height:72px;display:flex;gap:12px}
.ph-wrap{position:relative;width:72px;height:72px;flex:none}
.photo{width:72px;height:72px;border-radius:20px;overflow:hidden;background:var(--gray)}
.photo img{width:100%;height:100%;object-fit:cover;filter:var(--photo);display:block}
/* site badge: 20 on the photo's corner, ringed in the card's own color */
.logo{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:12px;border:2px solid var(--ring)}
.field .logo{border-color:var(--ring-field)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.meta-row{height:20px;display:flex;justify-content:space-between;align-items:center;margin-right:8px}
.ktag{height:20px;padding:0 8px 0 4px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;font:400 13px/1 var(--ft);color:#0A0A0A}
.ktag .ti{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.needs{background:#F5D297}.sold{background:#A1EACB}
.clock{display:inline-flex;align-items:center;gap:4px;font:400 13px/18px var(--ft);color:var(--ink2)}
.ci{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.t{font:400 18px/24px var(--ft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font:400 15px/20px var(--ft);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m b{font-weight:400;color:var(--ink)}
.acts{height:40px;display:flex;gap:8px;flex:none}
.pill{height:40px;padding:0 20px;border-radius:20px;display:inline-flex;align-items:center;font:500 15px/1 var(--ft);white-space:nowrap}
.act{background:var(--act);color:var(--act-ink)}
.sec{background:var(--sec);color:var(--ink)}
.field .sec{background:var(--sec-field)}
.more{width:40px;padding:0;justify-content:center}
/* notice: a tappable row; the chevron says it leads somewhere */
.notice{height:56px;flex:none;border-radius:28px;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--card-edge);font:400 15px/20px var(--ft)}
.notice span{flex:1}
.notice .chev{width:20px;height:20px;color:var(--ink2);stroke-width:1.8}
.tabs{position:absolute!important;left:0;right:0;bottom:0;height:84px;border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding-top:10px;color:var(--ink2);font:500 11px/13px var(--ft);background:var(--page)}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs .on{color:var(--ink)}
.L{--scrim:rgb(10 10 10/.4);--page:#F1F3F5;--ink:#0A0A0A;--ink2:rgb(10 10 10/.62);--surface:#FFFFFF;--gray:#EFF1F2;--rule:rgb(10 10 10/.08);
 --card-edge:0 0 0 1px rgb(10 10 10/.07);
 --f1:#A5E1FE;--f2:#A1EACB;--f3:#EBF08F;--act:#0A0A0A;--act-ink:#FFFFFF;--sec:#EFF1F2;--sec-field:rgb(255 255 255/.72);
 --photo:none;--ring:#FFFFFF;--ring-field:#FFFFFF;--badge-ring:#F1F3F5;
 --wash:radial-gradient(120% 90% at 15% 0%,rgb(165 225 254/.32),transparent 70%),radial-gradient(90% 80% at 95% 0%,rgb(161 234 203/.26),transparent 70%)}
.Dk{--scrim:rgb(0 0 0/.6);--page:#101315;--ink:#ECEFF1;--ink2:#B4BABD;--surface:#1A1D20;--gray:#2A2F31;--rule:rgb(255 255 255/.12);
 --card-edge:inset 0 0 0 1px rgb(255 255 255/.08);
 --f1:#0A4C65;--f2:#03523B;--f3:#025050;--act:#ECEFF1;--act-ink:#0A0A0A;--sec:#2A2F32;--sec-field:rgb(255 255 255/.14);
 --photo:brightness(.92);--ring:#1A1D20;--ring-field:#0E3B4D;--badge-ring:#101315;
 --wash:radial-gradient(120% 90% at 15% 0%,rgb(10 76 101/.34),transparent 70%),radial-gradient(90% 80% at 95% 0%,rgb(3 82 59/.26),transparent 70%)}
.Dk .field{--ink2:#CDD2D4}

/* New: a 56 circle in the middle of the tab bar, raised 12 */
.tabs .new{position:relative;top:-14px;width:56px;height:56px;border-radius:28px;background:var(--act);color:var(--act-ink);display:grid!important;place-items:center;gap:0!important}
.tabs .new svg{width:26px;height:26px;stroke-width:1.8}
.tabs .new.open svg{transform:rotate(45deg)}
.scrim{position:absolute!important;inset:0;background:var(--scrim);z-index:5}
.menu{position:absolute!important;left:0;right:0;bottom:118px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px}
.menu .opt{height:56px;min-width:220px;padding:0 24px 0 16px;border-radius:28px;background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:12px;font:500 15px/20px var(--ft);box-shadow:var(--card-edge)}
.menu .opt:nth-child(1){transform:translateY(0)}
.tabs.raised{z-index:7}
/* camera */
.cam{background:#000!important;color:#fff;padding:0!important}
.cam .feed{position:absolute!important;inset:0;background:url(img/img/r8/carhartt-jacket.jpg) center/cover;filter:brightness(.9)}
.cam .shade{position:absolute!important;inset:0;background:linear-gradient(#000a,transparent 22%,transparent 70%,#000c)}
.cam .bar{position:absolute!important;top:54px;left:20px;right:20px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.cam .bar .x{width:44px;height:44px;border-radius:22px;background:rgb(0 0 0/.35);display:grid;place-items:center}
.cam .steps{display:flex;gap:6px;align-items:center;font:500 15px/20px var(--ft)}
.cam .steps i{width:6px;height:6px;border-radius:3px;background:rgb(255 255 255/.4);display:inline-block}
.cam .steps i.on{background:#fff;width:18px}
.frame{position:absolute!important;left:48px;right:48px;top:210px;height:380px;z-index:2}
.frame b{position:absolute;width:40px;height:40px;border:3px solid #fff}
.frame b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:20px 0 0 0}
.frame b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 20px 0 0}
.frame b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 20px}
.frame b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 20px 0}
.sweep{position:absolute;left:6px;right:6px;top:46%;height:84px;background:linear-gradient(180deg,transparent,rgb(165 225 254/.0) 20%,rgb(165 225 254/.35) 70%,rgb(161 234 203/.9) 98%,transparent);border-bottom:2px solid #A1EACB}
.found{position:absolute!important;left:20px;right:20px;bottom:150px;z-index:2;display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 12px;border-radius:16px;background:rgb(255 255 255/.92);color:#0A0A0A;display:inline-flex;align-items:center;gap:6px;font:400 15px/20px var(--ft)}
.chip.wait{background:rgb(255 255 255/.22);color:#fff}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.work{position:absolute!important;left:20px;right:20px;bottom:112px;z-index:2;font:400 13px/18px var(--ft);color:rgb(255 255 255/.8)}
.shutter{position:absolute!important;left:50%;bottom:28px;margin-left:-38px;width:76px;height:76px;border-radius:38px;border:4px solid #fff;display:grid;place-items:center;z-index:2}
.shutter i{width:60px;height:60px;border-radius:30px;background:#fff;display:block}
.dot{position:absolute;width:5px;height:5px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgb(165 225 254/.5)}
</style></head><body>
BODY
</body></html>
