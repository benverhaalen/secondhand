<!-- C. Three phones in a row, the way app store pages show screens, with each step under its screen. Centered heading. On a phone the three become a sideways row you swipe. -->
<style>
  .s2 { padding-block: var(--s-9); }
  .s2 h2 { font: var(--w-text) var(--t-section)/1.1 var(--font-text); letter-spacing: -0.02em; max-width: 20ch; text-wrap: balance; }
  .s2 .lead { margin: var(--s-6) 0 0; max-width: 36ch; font-size: var(--t-21); line-height: 1.33; }
  .step h3 { font: var(--w-text) var(--t-feature)/1.2 var(--font-text); letter-spacing: -0.01em; }
  .step p { margin-top: var(--s-2); color: var(--ink-2); font-size: var(--t-18); line-height: var(--lh-18); max-width: 30ch; }
  .phone { width: 300px; aspect-ratio: 390 / 844; border-radius: var(--r-card); border: 1px solid var(--rule); overflow: hidden; background: var(--surface); flex: none; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  @media (max-width: 760px) { .phone { width: 220px; } }
  .s2 h2 { margin-inline: auto; text-align: center; }
  .row3 { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: var(--s-8); margin-top: var(--s-8); padding: 0; list-style: none; }
  .row3 .step { display: grid; gap: var(--s-5); justify-items: start; }
  .row3 .phone { width: 280px; }
  @media (max-width: 760px) { .row3 { grid-template-columns: repeat(3, 240px); justify-content: start; overflow-x: auto; gap: var(--s-4); scroll-snap-type: x mandatory; } .row3 .step { scroll-snap-align: start; } .row3 .phone { width: 220px; } }
  header.top { position: relative; }
  header.top .wrap { height: var(--bar); align-items: center; }
</style>
</head>
