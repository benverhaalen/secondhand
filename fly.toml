# Nate creates and names the app; this file creates nothing.
# Nate sets secrets with fly secrets set, never in this file:
# DECISION_SIGNING_KEY, SECONDHAND_VISITOR_KEY, SECONDHAND_VAULT_KEY
# Optional vendor credentials (enable only the runtime paths Nate wants):
# EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, APIFY_TOKEN, BROWSER_USE_API_KEY,
# OPENROUTER_API_KEY, DATABRICKS_HOST, DATABRICKS_WAREHOUSE_ID, DATABRICKS_TOKEN
# Run one machine: fly scale count 1 (the watcher runs in-process).
app = "secondhand-api" # Nate names the app when he creates it.
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = 30

[env]
NODE_ENV = "production"
SECONDHAND_DATA_DIR = "/data"
SECONDHAND_PEER_HEADER = "Fly-Client-IP"
PORT = "8080"
SECONDHAND_PUBLIC_ORIGIN = "https://secondhand-api.fly.dev"
APPLE_CLIENT_IDS = "com.bnvg.secondhand"
GOOGLE_CLIENT_IDS = "599008877776-7t6d8jiuipqovrpejs5dvvpfnu8ji8lh.apps.googleusercontent.com"
SECONDHAND_WEB_ORIGINS = "https://asecondhand.app,https://www.asecondhand.app,https://secondhand-eight.vercel.app"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[mounts]
source = "secondhand_data"
destination = "/data"
initial_size = "1gb"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
