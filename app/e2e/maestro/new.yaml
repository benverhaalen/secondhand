# New, the ＋ (app/behavior/new.json) on a phone or simulator: the same states as app/e2e/new.test.mjs.
# Expo Go, with npx expo start running:  maestro test app/e2e/maestro/new.yaml
# A development build:                  maestro test -e APP_ID=<bundle id> -e URL=secondhand:// app/e2e/maestro/new.yaml
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
  URL: exp://127.0.0.1:8081
---
- launchApp
- openLink: ${URL}
- extendedWaitUntil:
    visible: "secondhand"
    timeout: 30000
# open: the ＋ grows into the field over the screen and the three jobs rise, centered.
- tapOn: { id: "tab-new" }
- extendedWaitUntil:
    visible: "Sell it"
    timeout: 5000
- assertVisible: "What’s it worth"
- assertVisible: "Find or buy it"
# × plays it back into the button.
- tapOn: { id: "new-close" }
- extendedWaitUntil:
    notVisible: "Sell it"
    timeout: 3000
# sell: the pencil at Sell it's end takes a pasted link, and the listing comes in as a draft to review.
- tapOn: { id: "tab-new" }
- tapOn: { id: "new-sell-type" }
- assertVisible: "Make a draft"
- tapOn: { id: "type-field" }
- inputText: "https://example.invalid/listing/42"
- assertVisible: "Bring it in"
- tapOn: { id: "sell-go" }
- extendedWaitUntil:
    visible: "Review"
    timeout: 5000
# worth: the pencil at What's it worth's end takes words, and the value page opens.
- tapOn: { id: "tab-new" }
- tapOn: { id: "new-worth-type" }
- tapOn: { id: "type-field" }
- inputText: "carhart detroit jacket"
- assertVisible: "Carhartt Detroit Jacket J97"
- tapOn: { id: "worth-go" }
# find: the pencil at Find or buy it's end takes words, and the matches open.
- tapOn: { id: "tab-new" }
- tapOn: { id: "new-find-type" }
- tapOn: { id: "type-field" }
- inputText: "A blue sofa, three seats"
- tapOn: { id: "find-go" }
# Sell it opens the camera out of the capsule.
- tapOn: { id: "tab-new" }
- tapOn: { id: "new-sell" }
- extendedWaitUntil:
    visible: "Show the whole front"
    timeout: 5000
