- openLink: ${URL}/want?id=want_kin&world=buyer
- extendedWaitUntil:
    visible: "Paused"
    timeout: 15000
- tapOn: { id: "want-pause" }
- extendedWaitUntil:
    visible: "Looking again"
    timeout: 5000
# State: radius
- openLink: ${URL}/want?id=want_oven&world=buyer
- extendedWaitUntil:
    visible: "25 mi"
    timeout: 15000
- assertVisible: "Colour"
- assertVisible: "Marseille"
# want-radius-5: sets the pickup radius, with Undo
- openLink: ${URL}/want?id=want_oven&world=buyer
- extendedWaitUntil:
    visible: "25 mi"
    timeout: 15000
- tapOn: { id: "want-radius-5" }
- extendedWaitUntil:
    visible: "Saved"
    timeout: 5000
# want-colour-any: goes back to any colour, with Undo
