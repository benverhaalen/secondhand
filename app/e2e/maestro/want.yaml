- extendedWaitUntil:
    visible: "25 mi"
    timeout: 15000
- tapOn: { id: "want-colour-any" }
- extendedWaitUntil:
    visible: "Saved"
    timeout: 5000
# State: new
- openLink: ${URL}/want?q=nike%20dunk%20low%20grey%2010
- extendedWaitUntil:
    visible: "Watch for"
    timeout: 15000
- assertVisible: "Watch for \\$80 or less"
- assertVisible: "Where"
# want-start: starts watching at the guessed range
- openLink: ${URL}/want?q=nike%20dunk%20low%20grey%2010
- extendedWaitUntil:
    visible: "Watch for"
    timeout: 15000
- tapOn: { id: "want-start" }
- extendedWaitUntil:
    visible: "Watching\\. You can leave and come back\\."
    timeout: 5000
# want-start: the sites answer one by one, with what they found so far
- openLink: ${URL}/want?q=nike%20dunk%20low%20grey%2010
- extendedWaitUntil:
    visible: "Watch for"
    timeout: 15000
- tapOn: { id: "want-start" }
- extendedWaitUntil:
    visible: "Found 6 so far"
    timeout: 5000
# State: jersey
- openLink: ${URL}/want?q=brewers%20jersey%20around%20%2460
- extendedWaitUntil:
    visible: "Colour"
    timeout: 15000
- assertVisible: "\\$48 to \\$72"
- assertVisible: "15 mi"
- assertVisible: "Navy"
- assertVisible: "XL"
- assertVisible: "Not enough sales yet to show"
- assertVisible: "Watch for \\$72 or less"
# want-price: moves the nearer end to the middle of the track, and the foot follows
- openLink: ${URL}/want?q=brewers%20jersey%20around%20%2460
- extendedWaitUntil:
    visible: "Colour"
    timeout: 15000
- tapOn: { id: "want-price" }
- extendedWaitUntil:
    visible: "Watch for \\$60 or less"
    timeout: 5000
# want-how-ship: keeps shipped ones only on the guess
- openLink: ${URL}/want?q=brewers%20jersey%20around%20%2460
- extendedWaitUntil:
    visible: "Colour"
    timeout: 15000
- tapOn: { id: "want-how-ship" }
- extendedWaitUntil:
    visible: "Watch for \\$72 or less"
    timeout: 5000
# want-colour-navy: picks navy
- openLink: ${URL}/want?q=brewers%20jersey%20around%20%2460
- extendedWaitUntil:
    visible: "Colour"
    timeout: 15000
- tapOn: { id: "want-colour-navy" }
- assertVisible: { id: "want-colour-navy" }
# State: clearing
- openLink: ${URL}/want?id=want_desk
- extendedWaitUntil:
    visible: "10 mi"
    timeout: 15000
- assertVisible: "Standing desk under \\$150 within 10 miles"
# State: empty
- openLink: ${URL}/want
- extendedWaitUntil:
    visible: "Nothing to watch yet"
    timeout: 15000
# want-empty-search: goes to Buy to search
- openLink: ${URL}/want
- extendedWaitUntil:
    visible: "Nothing to watch yet"
    timeout: 15000
- tapOn: { id: "want-empty-search" }
# State: failed
- openLink: ${URL}/want?state=failed
- extendedWaitUntil:
    visible: "Couldn’t load this want"
    timeout: 15000
- assertVisible: "Try again"
# want-retry: loads the page afresh
- openLink: ${URL}/want?state=failed
- extendedWaitUntil:
    visible: "Couldn’t load this want"
    timeout: 15000
- tapOn: { id: "want-retry" }
# State: offline
- openLink: ${URL}/want?state=offline
- extendedWaitUntil:
    visible: "Waiting for signal\\. This is the last copy\\."
    timeout: 15000
