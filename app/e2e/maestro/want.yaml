# The want screen (app/behavior/want.json) on a phone or simulator: the same states and controls as app/e2e/want.test.mjs.
# Expo Go, with npx expo start running:  maestro test app/e2e/maestro/want.yaml
# A development build:                  maestro test -e APP_ID=<bundle id> -e URL=secondhand:// app/e2e/maestro/want.yaml
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
  URL: exp://127.0.0.1:8081/--
---
- launchApp
# State: typical
- openLink: ${URL}/want?id=want_dunk&world=buyer
- extendedWaitUntil:
    visible: "Watching for"
    timeout: 15000
- assertVisible: "Nike Dunk Low Grey Fog, men’s 10, under \\$80"
- assertVisible: "Looking on 4 sites"
- assertVisible: "Behind"
- assertVisible: "Found 4 so far"
- assertVisible: "\\$64 to \\$80"
- assertVisible: "Men’s US"
- assertVisible: "Pause"
- assertVisible: "End"
# nav-back: goes back
- openLink: ${URL}/want?id=want_dunk&world=buyer
- extendedWaitUntil:
    visible: "Watching for"
    timeout: 15000
- tapOn: { id: "nav-back" }
# want-what: edits what to look for in place
- openLink: ${URL}/want?id=want_dunk&world=buyer
- extendedWaitUntil:
    visible: "Watching for"
    timeout: 15000
- tapOn: { id: "want-what" }
- assertVisible: { id: "want-what-input" }
# want-price: moves the nearer end of the range to where it was tapped, saves it with Undo
- openLink: ${URL}/want?id=want_dunk&world=buyer
- extendedWaitUntil:
    visible: "Watching for"
    timeout: 15000
- tapOn: { id: "want-price" }
- extendedWaitUntil:
    visible: "Saved"
    timeout: 5000
# want-site-ebay: turns that site off, with Undo
- openLink: ${URL}/want?id=want_dunk&world=buyer
- extendedWaitUntil:
    visible: "Watching for"
    timeout: 15000
- tapOn: { id: "want-site-ebay" }
- extendedWaitUntil:
    visible: "Site off"
    timeout: 5000
