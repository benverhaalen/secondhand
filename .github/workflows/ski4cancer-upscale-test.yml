name: ski4cancer upscale test
# One-off: upscales 6 Ski for Cancer archive images through OpenRouter using this repo's key,
# then commits the outputs back to this branch. Never runs on main.
on:
  push:
    branches: ['claude/ski4cancer-upscale-test']
    paths: ['research/ski4cancer-upscale-test/models.txt', 'research/ski4cancer-upscale-test/run_or.py', '.github/workflows/ski4cancer-upscale-test.yml']
permissions:
  contents: write
concurrency: ski4cancer-upscale-test
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upscale via OpenRouter
        env:
          K1: ${{ secrets.OPENROUTER_API_KEY }}
          K2: ${{ secrets.OPENROUTER_KEY }}
          K3: ${{ secrets.OPEN_ROUTER_API_KEY }}
          K4: ${{ secrets.OPENROUTER }}
          K5: ${{ secrets.OPEN_ROUTER }}
        run: |
          export OPENROUTER_API_KEY="${K1:-${K2:-${K3:-${K4:-$K5}}}}"
          [ -n "$OPENROUTER_API_KEY" ] || { echo "no OpenRouter secret"; exit 1; }
          pip install -q pillow
          D=research/ski4cancer-upscale-test
          python3 -I $D/run_or.py $D/orig $D/out $(cat $D/models.txt) | tee $D/run.log || true
          # fail closed if the key leaked into any output
          if grep -rqF "$OPENROUTER_API_KEY" $D; then echo "key found in outputs"; rm -rf $D/out $D/run.log; exit 1; fi
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add research/ski4cancer-upscale-test || true
          git commit -m "test: ski4cancer upscale run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --no-rebase origin "$GITHUB_REF_NAME" 2>/dev/null; git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
