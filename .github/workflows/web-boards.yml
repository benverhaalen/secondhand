name: web section boards
# Draws the website's section boards (brand/explore/web-home/boards) in the brand faces, which are licensed and live only
# in the BRAND_FONTS secret, audits each variant with the web brand check, and commits the renders to this branch.
# Lean by default (Ben, 08:31): a push redraws and checks only the boards and pages its files touched, and nothing is
# recorded. Recordings come only from a manual run with "record" on.
on:
  push:
    branches: [claude/project-thread-dbgps7, main]
    # The app's screens on the site are redrawn whenever the app changes (L61; Ben, 10:24: "rerender on each build because
    # the app updates a lot").
    paths: ['brand/explore/web-home/**', '!brand/explore/web-home/boards/*/out/**', '!brand/explore/web-home/hero/out/**', '!brand/explore/web-home/app/**', 'brand/tokens.css', '.github/workflows/web-boards.yml', 'app/src/**', 'app/assets/**', 'app/package-lock.json']
  workflow_dispatch:
    inputs:
      record: { description: 'Also record the motion boards and the hero open (mp4)', type: boolean, default: false }
permissions:
  contents: write
concurrency: web-boards
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find what this push touched
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          W=brand/explore/web-home
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then files=ALL; else files=$(git diff --name-only "$BEFORE" HEAD); fi
          shared="^($W/site.css|$W/hands-fit.js|brand/tokens.css|scripts/brand-check.mjs|\.github/workflows/web-boards.yml)$"
          all=no; { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Eq "$shared"; } && all=yes
          boards=""; for d in $W/boards/*/; do
            if [ $all = yes ] || printf '%s\n' "$files" | grep -v '/out/' | grep -Eq "^${d}|^$W/boards/(render|audit)\.mjs$"; then boards="$boards $d"; fi; done
          hands=no; { [ $all = yes ] || printf '%s\n' "$files" | grep -v '/out/' | grep -q "^$W/boards/03-hands/"; } && hands=yes
          shots=no; { [ $all = yes ] || printf '%s\n' "$files" | grep -Eq "^app/(src|assets)/|^app/package-lock\.json$|^$W/app-s(creens\.json|hots\.mjs)$"; } && shots=yes
          hero=no; { [ $all = yes ] || [ $shots = yes ] || printf '%s\n' "$files" | grep -v '/out/' | grep -Eq "^$W/(hero|photos/wall)/|^$W/boards/audit\.mjs$"; } && hero=yes
          echo "boards=$boards" >> "$GITHUB_OUTPUT"; echo "hands=$hands" >> "$GITHUB_OUTPUT"; echo "hero=$hero" >> "$GITHUB_OUTPUT"; echo "shots=$shots" >> "$GITHUB_OUTPUT"
          echo "boards:${boards:- none}; hand sheets: $hands; hero: $hero; app shots: $shots"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Install ffmpeg, for the recordings
        if: inputs.record
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Unpack the brand faces
        env:
          BRAND_FONTS_B64: ${{ secrets.BRAND_FONTS }}
        run: |
          if [ -n "$BRAND_FONTS_B64" ]; then
            mkdir -p "$RUNNER_TEMP/fonts"
            printf '%s' "$BRAND_FONTS_B64" | base64 -d | tar xzf - -C "$RUNNER_TEMP/fonts"
            echo "BRAND_FONTS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"
            ls "$RUNNER_TEMP/fonts"
          else
            echo "::warning::BRAND_FONTS is not set, so the boards are drawn in a fallback face"
          fi
      # The app's own screens, drawn from its web build in the brand faces, for the site (app-shots.mjs). A screen that comes
      # out blank fails the run; the site never keeps a stale copy.
      - name: Install the app
        if: steps.changed.outputs.shots == 'yes'
        run: npm ci
        working-directory: app
      - name: Draw the app screens the site shows
        id: shots
        if: steps.changed.outputs.shots == 'yes'
        continue-on-error: true
        run: node brand/explore/web-home/app-shots.mjs
      - name: Draw the boards this push touched
        id: boards
        if: steps.changed.outputs.boards != ''
        continue-on-error: true
        env: { RECORD: "${{ inputs.record && '1' || '0' }}" }
        run: node brand/explore/web-home/boards/render.mjs ${{ steps.changed.outputs.boards }}
      - name: Draw every hand position in each pack
        if: steps.changed.outputs.hands == 'yes'
        run: node brand/explore/web-home/boards/03-hands/poses.mjs
      - name: Check the hero on every screen
        id: hero
        if: steps.changed.outputs.hero == 'yes'
        continue-on-error: true
        env: { RECORD: "${{ inputs.record && '1' || '0' }}" }
        run: |
          node brand/explore/web-home/hero/photos.mjs
          node brand/explore/web-home/hero/check.mjs
      - name: Commit the renders
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # Runs queue, so one can finish after the branch has moved on. If anything these renders are drawn from changed
          # since this run's commit, they show old code: keep the branch's renders and let the newer run draw them.
          git fetch -q origin "$GITHUB_REF_NAME"
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- brand app/src app/assets app/package-lock.json .agents/checks scripts \
              ':!brand/explore/web-home/boards/*/out' ':!brand/explore/web-home/hero/out' ':!brand/explore/web-home/app'; then
            echo "the branch moved past $GITHUB_SHA in what the renders are drawn from; not committing stale renders"; exit 0
          fi
          git add brand/explore/web-home/boards brand/explore/web-home/hero brand/explore/web-home/app
          git commit -m "test(web): section boards drawn in the brand faces" || exit 0
          git pull --no-rebase -X ours origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
      # The renders are committed either way, so the failure can be seen; then the run fails (web.md W14).
      - name: Fail when a board or the hero broke a brand rule or drew in a fallback face
        if: steps.boards.outcome == 'failure' || steps.hero.outcome == 'failure' || steps.shots.outcome == 'failure'
        run: |
          echo "::error::a board or the hero failed: see its out/audit.json"
          exit 1
