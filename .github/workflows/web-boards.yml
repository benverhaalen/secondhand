name: web section boards
# Draws the website's section boards (brand/explore/web-home/boards) in the brand faces, which are licensed and live only
# in the BRAND_FONTS secret, audits each variant with the web brand check, and commits the renders to this branch.
# Lean by default (Ben, 08:31): a push redraws and checks only the boards and pages its files touched, and nothing is
# recorded. Recordings come only from a manual run with "record" on.
on:
  push:
    branches: [claude/project-thread-dbgps7]
    paths: ['brand/explore/web-home/**', '!brand/explore/web-home/boards/*/out/**', '!brand/explore/web-home/hero/out/**', 'brand/tokens.css', '.github/workflows/web-boards.yml']
  workflow_dispatch:
    inputs:
      record: { description: 'Also record the motion boards and the hero open (mp4)', type: boolean, default: false }
permissions:
  contents: write
concurrency: web-boards
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find what this push touched
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          W=brand/explore/web-home
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then files=ALL; else files=$(git diff --name-only "$BEFORE" HEAD); fi
          shared="^($W/site.css|brand/mark.svg|brand/mark-light.svg|brand/tokens.css|scripts/brand-check.mjs|\.github/workflows/web-boards.yml)$"
          all=no; { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Eq "$shared"; } && all=yes
          boards=""; for d in $W/boards/*/; do
            if [ $all = yes ] || printf '%s\n' "$files" | grep -v '/out/' | grep -Eq "^${d}|^$W/boards/(render|audit)\.mjs$"; then boards="$boards $d"; fi; done
          hero=no; { [ $all = yes ] || printf '%s\n' "$files" | grep -v '/out/' | grep -Eq "^$W/(hero|photos/wall)/|^$W/boards/audit\.mjs$"; } && hero=yes
          echo "boards=$boards" >> "$GITHUB_OUTPUT"; echo "hero=$hero" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Install ffmpeg, for the recordings
        if: inputs.record
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Unpack the brand faces
        env:
          BRAND_FONTS_B64: ${{ secrets.BRAND_FONTS }}
        run: |
          if [ -n "$BRAND_FONTS_B64" ]; then
            mkdir -p "$RUNNER_TEMP/fonts"
            printf '%s' "$BRAND_FONTS_B64" | base64 -d | tar xzf - -C "$RUNNER_TEMP/fonts"
            echo "BRAND_FONTS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"
            ls "$RUNNER_TEMP/fonts"
          else
            echo "::warning::BRAND_FONTS is not set, so the boards are drawn in a fallback face"
          fi
      - name: Draw the boards this push touched
        if: steps.changed.outputs.boards != ''
        env: { RECORD: "${{ inputs.record && '1' || '0' }}" }
        run: node brand/explore/web-home/boards/render.mjs ${{ steps.changed.outputs.boards }}
      - name: Check the hero on every screen
        if: steps.changed.outputs.hero == 'yes'
        env: { RECORD: "${{ inputs.record && '1' || '0' }}" }
        run: |
          node brand/explore/web-home/hero/photos.mjs
          node brand/explore/web-home/hero/check.mjs || echo "::warning::the hero check found a screen that breaks; see hero/out/audit.json"
      - name: Commit the renders
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brand/explore/web-home/boards brand/explore/web-home/hero
          git commit -m "test(web): section boards drawn in the brand faces" || exit 0
          # Two runs can overlap: the newer run's renders win any clash over the same out/ files, since they are drawn
          # from the newer code.
          git pull --no-rebase -X ours origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
