name: studio touch-up test
on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model slug
        default: bytedance-seed/seedream-5-5
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Render touch-ups
        env:
          K1: ${{ secrets.OPENROUTER_API_KEY }}
          K2: ${{ secrets.OPENROUTER_KEY }}
          K3: ${{ secrets.OPEN_ROUTER_API_KEY }}
          K4: ${{ secrets.OPENROUTER }}
          STUDIO_MODEL: ${{ inputs.model }}
        run: |
          export OPENROUTER_API_KEY="${K1:-${K2:-${K3:-$K4}}}"
          python3 research/studio/ben/prototype/touchup.py assets/demo-items/real research/studio/ben/renders
      - name: Shrink for the repo
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in glob.glob('research/studio/ben/renders/*.png'):
              im = Image.open(f).convert('RGB'); print(f, im.size)
              im.thumbnail((1600, 1600)); im.save(f[:-4] + '.jpg', quality=90); os.remove(f)
          PY
      - name: Commit renders
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/studio/ben/renders
          git commit -m "test(studio): touch-up renders of the three real items" || exit 0
          git pull --no-rebase origin main && git push origin HEAD:main
